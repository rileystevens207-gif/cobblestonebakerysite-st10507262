<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enquire | Cobblestone Bakery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Cobblestone Bakery</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="enquiry.html">Enquire</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Order or Enquire</h2>
    <p>
      Use the form below for custom cake orders or general product enquiries.
      We'll get back to you within 1–2 business days.
    </p>

    <!--
      Note: form has no backend yet — this is the Part 1 HTML structure only.
      The "action" attribute will be connected to real form handling in a later part.
    -->
    <form action="#" method="post">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone">

      <label for="enquiry-type">Enquiry Type</label>
      <select id="enquiry-type" name="enquiry-type">
        <option value="cake-order">Custom Cake Order</option>
        <option value="bread-order">Bulk Bread Order</option>
        <option value="general">General Enquiry</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit" class="btn">Submit Enquiry</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Cobblestone Bakery, Cape Town. All rights reserved.</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
